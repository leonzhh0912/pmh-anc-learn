name: Publish

# Publishes the app to GitHub Pages on every push to main.
# It uses the production build, which refuses any lesson or video that is not APPROVED/PUBLISHED
# (CONTENT_REVIEW.md). Until a PMH reviewer records sign-off with `npm run record-approval`,
# this workflow fails at "Production build" and nothing is published.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Production build (fails if any content is not approved)
        run: npm run build:production
        env:
          # https://<owner>.github.io/<repo>/, or the domain root for a repo named <owner>.github.io
          BASE_PATH: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
          # Accounts (sign-in, synced progress, staff pages) switch on ONLY when these repository variables are
          # set (Settings -> Secrets and variables -> Actions -> Variables). Unset = today's site, no sign-in.
          # Both values are public by design; never put the server's secret key in a variable or in Git.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SIGNIN_METHODS: ${{ vars.VITE_SIGNIN_METHODS || 'password' }}
      - name: Single-page app fallback (GitHub Pages serves 404.html for unknown paths)
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # the site carries ~300 MB of lesson video; GitHub needs longer than the default 10 min to sync it
          timeout: 1800000
