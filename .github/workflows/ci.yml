name: CI

on:
  pull_request:
  push:
    branches: [main]

# Checks content and code on every pull request and on main.
# No secrets are needed: it never calls the TTS provider.
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Validate lesson content
        run: npm run validate:content
      - name: Type-check
        run: npx tsc -b
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (every lesson, phone + desktop)
        run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

  video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci
      - name: Check video scripts
        run: npm run check-scripts
      - name: Type-check
        run: npx tsc --noEmit --resolveJsonModule
